<text x="40" y="45" font-size="30" font-weight="bold">Part I - FP8 adder: five annotated RTL test cases</text>
<text x="40" y="76" font-size="18">Actual Icarus VCD events; e3m4, bias 3; hex data buses; no clock or pipeline inside the DUT.</text>
<rect x="213.0" y="105" width="293.0" height="150" rx="8" fill="#e8f3fb" stroke="#457495"/>
<text x="225.0" y="132" font-size="20" font-weight="bold">Case 1</text>
<text x="225.0" y="159" font-size="17">positive normals: 1 + 1.5 =</text>
<text x="225.0" y="183" font-size="17">2.5</text>
<path d="M 359.5 255 L 359.5 282 l -5 -8 m 5 8 l 5 -8" fill="none" stroke="#457495" stroke-width="2"/>
<rect x="522.0" y="105" width="293.0" height="150" rx="8" fill="#e8f3fb" stroke="#457495"/>
<text x="534.0" y="132" font-size="20" font-weight="bold">Case 2</text>
<text x="534.0" y="159" font-size="17">negative normals: -1.5 + -1 =</text>
<text x="534.0" y="183" font-size="17">-2.5</text>
<path d="M 668.5 255 L 668.5 282 l -5 -8 m 5 8 l 5 -8" fill="none" stroke="#457495" stroke-width="2"/>
<rect x="831.0" y="105" width="293.0" height="150" rx="8" fill="#e8f3fb" stroke="#457495"/>
<text x="843.0" y="132" font-size="20" font-weight="bold">Case 3</text>
<text x="843.0" y="159" font-size="17">zero identity: +0 + 1.5 = 1.5</text>
<path d="M 977.5 255 L 977.5 282 l -5 -8 m 5 8 l 5 -8" fill="none" stroke="#457495" stroke-width="2"/>
<rect x="1140.0" y="105" width="293.0" height="150" rx="8" fill="#fef0dc" stroke="#457495"/>
<text x="1152.0" y="132" font-size="20" font-weight="bold">Case 4</text>
<text x="1152.0" y="159" font-size="17">overflow: 15.5 + 15.5 -&gt;</text>
<text x="1152.0" y="183" font-size="17">+infinity</text>
<path d="M 1286.5 255 L 1286.5 282 l -5 -8 m 5 8 l 5 -8" fill="none" stroke="#457495" stroke-width="2"/>
<rect x="1449.0" y="105" width="293.0" height="150" rx="8" fill="#fef0dc" stroke="#457495"/>
<text x="1461.0" y="132" font-size="20" font-weight="bold">Case 5</text>
<text x="1461.0" y="159" font-size="17">invalid: +infinity + -infinity</text>
<text x="1461.0" y="183" font-size="17">-&gt; quiet NaN</text>
